name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8"
      - run: python -m pytest -q
      - name: Decide one rendered case end to end
        run: |
          python -m terracog render hotfix-checkout-min-size --out build/case
          python -m terracog decide --plan build/case/plan.json --events build/case/cloudtrail.json \
            --tickets build/case/tickets.json --world build/case/world.json --report build/case/decision
      - name: Benchmark
        run: python -m terracog bench --out build/reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-py${{ matrix.python }}
          path: build/
